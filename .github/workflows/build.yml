name: Build AIPlayer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos SDKs
        uses: actions/cache@v4
        with:
          path: ~/theos/sdks
          key: theos-sdks-${{ runner.os }}-v1

      - name: Cache Theos core
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ hashFiles('**/Makefile') }}-v1
          restore-keys: |
            theos-${{ runner.os }}-

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          if [ -d "$HOME/theos" ]; then
            echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
            echo "$HOME/theos/bin"   >> "$GITHUB_PATH"
          else
            echo "ERROR: Theos not found"; exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          pip install torch==2.7.0 torchvision==0.22.0 "coremltools>=8,<10"

      # The on-device preprocessing (AIPreprocess.c) must stay bit-exact with the
      # dataset builder's torchvision resize + grayscale. Fails the build otherwise.
      - name: Test preprocessing parity
        run: python tools/test_preprocess.py

      # Detects simple vs causal from the checkpoint, checks the exported graph
      # against model.forward() in torch AND (on this macOS runner) in Core ML,
      # and writes AIPlayerConfig.json. Any mismatch fails the build.
      - name: Convert checkpoint to Core ML
        run: |
          set -euo pipefail
          python convert_to_coreml.py --checkpoint checkpoints/best.pt --out_dir build
          cat build/AIPlayerConfig.json

      # `coremlcompiler` can print errors and still exit 0, so any "error" text in
      # its output is treated as fatal regardless of exit code.
      - name: Compile Core ML models
        run: |
          set -euo pipefail
          cd build
          for model in *.mlmodel; do
            name="${model%.mlmodel}"
            xcrun coremlcompiler compile "$model" . 2>&1 | tee "/tmp/$name.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ] || grep -qi "error" "/tmp/$name.log"; then
              echo "ERROR: coremlcompiler failed for $name"; exit 1
            fi
            test -d "$name.mlmodelc" || { echo "ERROR: $name.mlmodelc was not produced"; exit 1; }
            du -sh "$name.mlmodelc"
          done
          # Every model the config lists must exist.
          python -c "import json,os,sys; c=json.load(open('AIPlayerConfig.json')); m=[x for x in c['models'] if not os.path.isdir(x)]; sys.exit('missing: %s' % m if m else 0)"

      - name: Build dylib
        run: |
          set -euo pipefail
          make clean || true
          make FINALPACKAGE=1 V=1

      - name: Locate build output
        id: find_dylib
        run: |
          set -euo pipefail
          DYLIB_PATH=".theos/obj/arm64/AIPlayer.dylib"
          if [ ! -f "$DYLIB_PATH" ]; then
            echo "ERROR: $DYLIB_PATH not found. Check the 'Build dylib' step log above."
            exit 1
          fi
          echo "dylib_path=$DYLIB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-dylib
          path: ${{ steps.find_dylib.outputs.dylib_path }}
          if-no-files-found: error

      # Sideloadly only injects dylibs / frameworks / bundles, so the config and
      # every .mlmodelc it lists go inside AIPlayer.bundle. The Info.plist makes it
      # a real resource bundle; without one, code signing rejects the folder.
      - name: Package AIPlayer.bundle for Sideloadly
        run: |
          set -euo pipefail
          rm -rf AIPlayer.bundle
          mkdir AIPlayer.bundle
          cp build/AIPlayerConfig.json AIPlayer.bundle/
          cp -R build/*.mlmodelc AIPlayer.bundle/
          cat > AIPlayer.bundle/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>            <string>com.aiplayer.models</string>
            <key>CFBundleName</key>                  <string>AIPlayer</string>
            <key>CFBundlePackageType</key>           <string>BNDL</string>
            <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
            <key>CFBundleShortVersionString</key>    <string>1.0</string>
            <key>CFBundleVersion</key>               <string>${{ github.run_number }}</string>
          </dict>
          </plist>
          PLIST
          plutil -lint AIPlayer.bundle/Info.plist
          # Every model the config lists must be inside the bundle.
          python -c "import json,os,sys; c=json.load(open('AIPlayer.bundle/AIPlayerConfig.json')); m=[x for x in c['models'] if not os.path.isdir('AIPlayer.bundle/'+x)]; sys.exit('missing in bundle: %s' % m if m else 0)"
          zip -r AIPlayerBundle.zip AIPlayer.bundle
          unzip -l AIPlayerBundle.zip | head -40

      - name: Upload AIPlayer.bundle (for Sideloadly injection)
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-bundle
          path: AIPlayerBundle.zip
          if-no-files-found: error
