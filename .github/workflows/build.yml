name: Build AIPlayer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos SDKs
        uses: actions/cache@v4
        with:
          path: ~/theos/sdks
          key: theos-sdks-${{ runner.os }}-v1

      - name: Cache Theos core
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ hashFiles('**/Makefile') }}-v1
          restore-keys: |
            theos-${{ runner.os }}-

      - name: Install Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          if [ -d "$HOME/theos" ]; then
            echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
            echo "$HOME/theos/bin"   >> "$GITHUB_PATH"
          else
            echo "ERROR: Theos not found"; exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core ML conversion dependencies
        run: |
          set -euo pipefail
          # torch pinned per coremltools' own compatibility notes.
          pip install torch==2.7.0 coremltools

      # ── Checkpoint -> two Core ML models ─────────────────────────────────
      # convert_to_coreml.py exports SwipeEncoder.mlmodel (per-frame CNN) and
      # SwipeHead.mlmodel (windowed GRU head, zero initial state), then
      # verifies on this macOS runner that
      #   (1) the unrolled torch pipeline equals model.forward(), and
      #   (2) the saved Core ML models, run on CPU, equal model.forward().
      # Any mismatch fails the build, so a model that does not match what
      # training validated can never be packaged.
      - name: Convert checkpoint to Core ML
        run: |
          set -euo pipefail
          python convert_to_coreml.py \
            --checkpoint checkpoints/best.pt \
            --out_dir . \
            --img_size 128

      # `coremlcompiler` can print errors and still exit 0, so any "error"
      # text in its output is treated as fatal regardless of exit code.
      - name: Compile Core ML models
        run: |
          set -euo pipefail
          for name in SwipeEncoder SwipeHead; do
            xcrun coremlcompiler compile "$name.mlmodel" . 2>&1 | tee "/tmp/$name.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ] || grep -qi "error" "/tmp/$name.log"; then
              echo "ERROR: coremlcompiler failed for $name"; exit 1
            fi
            test -d "$name.mlmodelc" || { echo "ERROR: $name.mlmodelc was not produced"; exit 1; }
            du -sh "$name.mlmodelc"
          done

      - name: Build dylib
        run: |
          set -euo pipefail
          make clean || true
          make FINALPACKAGE=1 V=1

      - name: Locate build output
        id: find_dylib
        run: |
          set -euo pipefail
          DYLIB_PATH=".theos/obj/arm64/AIPlayer.dylib"
          if [ ! -f "$DYLIB_PATH" ]; then
            echo "ERROR: $DYLIB_PATH not found. Check the 'Build dylib' step log above."
            exit 1
          fi
          echo "dylib_path=$DYLIB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-dylib
          path: ${{ steps.find_dylib.outputs.dylib_path }}
          if-no-files-found: error

      # Both compiled models in one zip. Unzip, then drag BOTH .mlmodelc
      # folders into Sideloadly next to AIPlayer.dylib.
      - name: Package Core ML models for Sideloadly
        run: |
          set -euo pipefail
          zip -r AIPlayerModels.zip SwipeEncoder.mlmodelc SwipeHead.mlmodelc
          unzip -l AIPlayerModels.zip | head -30

      - name: Upload Core ML models (for Sideloadly injection)
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-models
          path: AIPlayerModels.zip
          if-no-files-found: error
